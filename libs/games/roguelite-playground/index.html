<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile: no pinch-zoom, draw under the notch (controls use env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>센티넬</title>
  </head>
  <!-- No page scroll, rubber-banding or pull-to-refresh: the game owns every gesture. -->
  <body style="margin: 0; background: #111; overflow: hidden; overscroll-behavior: none; touch-action: none">
    <!--
      GameCanvas now fills whatever size its own parent DOM element gives it
      (see engine-react's game-canvas.tsx) — the playground gives it the
      whole viewport here (dvh: the visible height on mobile, minus browser bars).
    -->
    <div id="root" style="width: 100vw; height: 100vh; height: 100dvh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
